<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4263eb">
<title>Мои консультации</title>
<style>
:root{--a:#4263eb;--bg:#f5f6f8;--muted:#748092}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1c2430}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:95px}
header{background:linear-gradient(135deg,#4263eb,#7950f2);color:#fff;padding:18px 16px}
h1{margin:0;font-size:25px}.sub{opacity:.85;margin-top:4px}
.page{display:none;padding:16px}.page.active{display:block}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 3px 14px #14203710}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.btn{border:0;border-radius:13px;padding:12px 15px;background:var(--a);color:#fff;font-weight:800;font-size:15px}
.secondary{background:#edf0ff;color:#364fc7}.danger{background:#e03131}
.fab{position:fixed;right:18px;bottom:105px;border-radius:50%;width:60px;height:60px;font-size:30px;padding:0}
.muted{color:var(--muted)}.time{font-size:21px;font-weight:850}.name{font-size:18px;font-weight:800;margin:8px 0 4px}
.appointment{border-left:4px solid var(--a)}
nav{position:fixed;bottom:0;left:0;right:0;margin:auto;max-width:520px;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 3px calc(8px + env(safe-area-inset-bottom));z-index:20}
nav button{border:0;background:none;color:#697386;font-weight:700;padding:5px}nav .active{color:var(--a)}
.ico{font-size:25px;display:block}.modal{display:none;position:fixed;inset:0;background:#0007;z-index:50;padding:20px;overflow:auto}.modal.open{display:block}
.box{max-width:500px;margin:15px auto;background:var(--bg);border-radius:22px;padding:18px}.box h2{margin:0 0 14px}
label{display:block;color:var(--muted);font-weight:750;margin:12px 0 6px}
input,textarea{width:100%;padding:13px;border:1px solid #e1e5ec;border-radius:12px;background:#fff;font-size:16px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{padding:13px 8px;border:1px solid #e1e5ec;border-radius:13px;background:#fff;font-weight:800;color:#526079}.choice.on{background:var(--a);color:#fff}
.actions{display:flex;gap:8px;margin-top:16px}.actions>*{flex:1}
.empty{text-align:center;padding:35px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
<header><h1>Мои консультации</h1><div class="sub" id="status">Онлайн</div></header>

<section id="today" class="page active">
<div class="row">
<button class="btn secondary" onclick="shift(-1)">‹</button>
<button class="btn secondary" onclick="selected=key(new Date());render()" id="dateTitle"></button>
<button class="btn secondary" onclick="shift(1)">›</button>
</div>
<div class="card" style="margin-top:12px">
<span class="muted">Записей</span><h2 id="count">0</h2>
<button class="btn" style="width:100%;margin-top:10px" onclick="sync(true)">↻ Синхронизировать</button>
</div>
<h2>Расписание</h2><div id="list"></div>
</section>

<section id="records" class="page"><h2>Все записи</h2><div id="all"></div></section>
<section id="clients" class="page"><div class="row"><h2>Клиенты</h2><button class="btn" onclick="newClient()">+ Клиент</button></div><div id="clist"></div></section>

<button class="btn fab" onclick="newAppt()">+</button>
<nav>
<button class="active" onclick="page('today',this)"><span class="ico">☀️</span>Сегодня</button>
<button onclick="page('records',this)"><span class="ico">🗂️</span>Записи</button>
<button onclick="page('clients',this)"><span class="ico">👥</span>Клиенты</button>
</nav>
</div>

<div id="modal" class="modal"><div class="box">
<h2 id="mtitle">Новая консультация</h2>
<label>Клиент</label><input id="mclient">
<label>Дата</label><input type="date" id="mdate">
<label>Начало</label><input type="time" id="mtime">
<label>До</label><input type="time" id="mend">
<label>Тип</label>
<div class="choices">
<button class="choice on" id="face" onclick="type='Очная консультация';pick()">Очная консультация</button>
<button class="choice" id="phone" onclick="type='Телефонная консультация';pick()">Телефонная консультация</button>
</div>
<label>Заметка</label><textarea id="mnote" rows="3"></textarea>
<div class="actions"><button class="btn secondary" onclick="closeM()">Отмена</button><button class="btn" onclick="saveAppt()">Сохранить</button></div>
<button id="del" class="btn danger" style="width:100%;margin-top:8px" onclick="delAppt()">Удалить запись</button>
</div></div>

<div id="clientModal" class="modal"><div class="box">
<h2 id="ctitle">Новый клиент</h2><label>Имя</label><input id="cname"><label>Телефон</label><input id="cphone"><label>Заметка</label><textarea id="cnote" rows="3"></textarea>
<div class="actions"><button class="btn secondary" onclick="closeClient()">Отмена</button><button class="btn" onclick="saveClient()">Сохранить</button></div>
</div></div>

<script>
const KEY='moi_offline_v2';
const API='https://moifinal.vercel.app/api';
let db={appointments:[],clients:[],queue:[],tmp:-1};
let date=new Date(),selected=key(date),editId=null,type='Очная консультация';

try{db=JSON.parse(localStorage.getItem(KEY))||db}catch(e){}

function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function end(a){if(a.end_time)return a.end_time;let[h,m]=a.time.split(':').map(Number),n=(h*60+m+(+a.duration||60))%1440;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function fmt(k){let[y,m,d]=k.split('-');let dt=new Date(+y,+m-1,+d);let mn=new Intl.DateTimeFormat('ru-RU',{month:'long'}).format(dt),wd=new Intl.DateTimeFormat('ru-RU',{weekday:'long'}).format(dt);return +d+' '+mn+' '+y+' года, '+wd.charAt(0).toUpperCase()+wd.slice(1)}
function page(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function card(a,d){return '<div class="card appointment" onclick="editAppt('+a.id+')">'+(d?'<div class="muted">'+esc(fmt(a.date))+'</div>':'')+'<div class="time">'+esc(a.time)+'–'+esc(end(a))+'</div><div class="name">'+esc(a.client_name)+'</div><div class="muted">'+esc(a.type||'Консультация')+'</div></div>'}
function render(){
document.getElementById('dateTitle').textContent=fmt(selected);
let a=db.appointments.filter(x=>x.date===selected).sort((a,b)=>a.time.localeCompare(b.time));
document.getElementById('count').textContent=a.length;
document.getElementById('list').innerHTML=a.length?a.map(card).join(''):'<div class="empty">Записей нет</div>';
let t=key(new Date());
let up=db.appointments.filter(a=>a.date>=t).slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
document.getElementById('all').innerHTML=up.map(a=>card(a,true)).join('')||'<div class="empty">Записей нет</div>';
document.getElementById('clist').innerHTML=db.clients.slice().sort((a,b)=>a.name.localeCompare(b.name,'ru')).map(c=>'<div class="card" onclick="editClient(\''+esc(c.name)+'\')"><b>'+esc(c.name)+'</b><div class="muted">'+esc(c.phone||'Телефон не указан')+'</div></div>').join('')||'<div class="empty">Клиентов пока нет</div>';
document.getElementById('status').textContent=navigator.onLine?(db.queue.length?'Онлайн · есть изменения для синхронизации':'Онлайн'):'Офлайн · данные на телефоне';
}
function shift(n){let d=new Date(selected+'T12:00');d.setDate(d.getDate()+n);selected=key(d);render()}

function newAppt(){editId=null;mtitle.textContent='Новая консультация';mclient.value='';mdate.value=selected;mtime.value='12:00';syncEnd();mnote.value='';type='Очная консультация';pick();del.style.display='none';modal.classList.add('open')}
function editAppt(id){let a=db.appointments.find(x=>+x.id===+id);if(!a)return;editId=id;mtitle.textContent='Редактировать запись';mclient.value=a.client_name;mdate.value=a.date;mtime.value=a.time;mend.value=end(a);mnote.value=a.note||'';type=a.type||'Очная консультация';pick();del.style.display='block';modal.classList.add('open')}
function syncEnd(){if(mtime.value){let[h,m]=mtime.value.split(':').map(Number),n=(h*60+m+60)%1440;mend.value=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}}
mtime.addEventListener('change',syncEnd);mtime.addEventListener('input',syncEnd);
function pick(){face.classList.toggle('on',type==='Очная консультация');phone.classList.toggle('on',type==='Телефонная консультация')}
function closeM(){modal.classList.remove('open')}

function saveAppt(){
let d={client_name:mclient.value.trim(),date:mdate.value,time:mtime.value,end_time:mend.value,type,note:mnote.value.trim(),duration:Math.max(1,(+mend.value.split(':')[0]*60+ +mend.value.split(':')[1])-(+mtime.value.split(':')[0]*60+ +mtime.value.split(':')[1])),price:0};
if(!d.client_name)return alert('Укажите клиента');
if(!d.date||!d.time||!d.end_time)return alert('Укажите дату и время');
if(d.duration<=0)return alert('Время окончания должно быть позже начала');
if(editId==null){d.id=db.tmp--;db.appointments.push(d);db.queue.push({t:'ac',d:{...d,id:undefined}})}
else{let a=db.appointments.find(x=>+x.id===+editId);if(a)Object.assign(a,d,{id:editId});if(+editId<0){let q=db.queue.find(x=>x.t==='ac'&&x.d&&x.d.id===undefined);if(q)q.d={...d,id:undefined}}else db.queue.push({t:'au',d:{...d,id:editId}})}
save();closeM();selected=d.date;render();sync(false)
}

async function delAppt(){
if(!confirm('Удалить запись?'))return;
let id=+editId;
if(id>0){
 if(!navigator.onLine)return alert('Подключитесь к интернету и повторите.');
 try{let r=await fetch(API+'/appointments?id='+encodeURIComponent(id),{method:'DELETE'});if(!r.ok)return alert('Не удалось удалить запись');db.appointments=db.appointments.filter(x=>+x.id!==id);save();closeM();render();await sync(false)}catch(e){alert('Ошибка соединения')}
}else{
db.appointments=db.appointments.filter(x=>+x.id!==id);db.queue=db.queue.filter(q=>!(q.t==='ac'&&q.d&&q.d.id===undefined));save();closeM();render()
}
}

function newClient(){editClientName=null;ctitle.textContent='Новый клиент';cname.value='';cphone.value='';cnote.value='';clientModal.classList.add('open')}
let editClientName=null;
function editClient(n){let c=db.clients.find(x=>x.name===n);if(!c)return;editClientName=n;ctitle.textContent='Клиент';cname.value=c.name;cphone.value=c.phone||'';cnote.value=c.note||'';clientModal.classList.add('open')}
function closeClient(){clientModal.classList.remove('open')}
function saveClient(){let d={old_name:editClientName||'',name:cname.value.trim(),phone:cphone.value.trim(),note:cnote.value.trim()};if(!d.name)return alert('Укажите имя');if(editClientName){let c=db.clients.find(x=>x.name===editClientName);if(c)Object.assign(c,{name:d.name,phone:d.phone,note:d.note});db.appointments.forEach(a=>{if(a.client_name===editClientName)a.client_name=d.name});db.queue.push({t:'cu',d})}else{let c={id:db.tmp--,name:d.name,phone:d.phone,note:d.note};db.clients.push(c);db.queue.push({t:'cc',d})}save();closeClient();render();sync(false)}

async function sync(manual){
if(!navigator.onLine){if(manual)alert('Нет интернета');return}
try{
 document.getElementById('status').textContent='Синхронизация…';

 // First send all local queued changes. This prevents an empty server
 // from overwriting today's local records.
 for(const q of [...db.queue]){
   let url=q.t[1]==='a'?API+'/appointments':API+'/clients';
   let method=q.t[1]==='d'?'DELETE':q.t[1]==='c'?'POST':'PUT';
   let body=q.t==='cd'?{name:q.name}:q.d;
   let r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
   if(!r.ok)throw new Error('SYNC_QUEUE');
   if(q.t==='ac'){
     let j=await r.json();
     let local=db.appointments.find(a=>a.id===q.d.id);
     if(local&&j.id){local.id=j.id}
   }
   db.queue.splice(db.queue.indexOf(q),1);save();
 }

 // Then read server data and merge, never replace local-only records.
 const [ar,cr]=await Promise.all([fetch(API+'/appointments'),fetch(API+'/clients')]);
 if(!ar.ok||!cr.ok)throw new Error('SYNC_GET');
 const aj=await ar.json(), cj=await cr.json();
 const serverApps=aj.appointments||[],serverClients=cj.clients||[];

 const byId=new Map(serverApps.map(a=>[String(a.id),a]));
 const localOnly=db.appointments.filter(a=>!a.id||+a.id<0);
 db.appointments=[...serverApps.map(a=>({...a,end_time:end(a)})),...localOnly];

 const clientByName=new Map(serverClients.map(c=>[c.name.toLowerCase(),c]));
 for(const c of db.clients){
   if(!clientByName.has(c.name.toLowerCase()))clientByName.set(c.name.toLowerCase(),c);
 }
 db.clients=[...clientByName.values()];
 save();render();
 if(manual)alert('Синхронизация завершена');
}catch(e){
 render();
 if(manual)alert('Синхронизация не завершена. Записи на телефоне сохранены.');
}
}

addEventListener('online',()=>sync(false));
addEventListener('offline',render);
render();
</script>
</body>
</html>
