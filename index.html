<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4263eb">
<title>Мои консультации</title>
<meta name="app-version" content="2026-09-29-fix-3">
<style>
:root{--a:#4263eb;--bg:#f5f6f8;--muted:#748092}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1c2430}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:95px}
header{background:linear-gradient(135deg,#4263eb,#7950f2);color:#fff;padding:18px 16px}
h1{margin:0;font-size:25px}.sub{opacity:.85;margin-top:4px}
.page{display:none;padding:16px}.page.active{display:block}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 3px 14px #14203710}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.btn{border:0;border-radius:13px;padding:12px 15px;background:var(--a);color:#fff;font-weight:800;font-size:15px}
.secondary{background:#edf0ff;color:#364fc7}.danger{background:#e03131}
.fab{position:fixed;right:18px;bottom:105px;border-radius:50%;width:60px;height:60px;font-size:30px;padding:0}
.muted{color:var(--muted)}.time{font-size:21px;font-weight:850}
.name{font-size:18px;font-weight:800;margin:8px 0 4px}.appointment{border-left:4px solid var(--a)}
nav{position:fixed;bottom:0;left:0;right:0;margin:auto;max-width:520px;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 3px calc(8px + env(safe-area-inset-bottom));z-index:20}
nav button{border:0;background:none;color:#697386;font-weight:700;padding:5px}nav .active{color:var(--a)}
.ico{font-size:25px;display:block}
.modal{display:none;position:fixed;inset:0;background:#0007;z-index:50;padding:20px;overflow:auto}.modal.open{display:block}
.box{max-width:500px;margin:15px auto;background:var(--bg);border-radius:22px;padding:18px}.box h2{margin:0 0 14px}
label{display:block;color:var(--muted);font-weight:750;margin:12px 0 6px}
input,textarea,select{width:100%;padding:13px;border:1px solid #e1e5ec;border-radius:12px;background:#fff;font-size:16px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{padding:13px 8px;border:1px solid #e1e5ec;border-radius:13px;background:#fff;font-weight:800;color:#526079}
.choice.on{background:var(--a);color:#fff}.actions{display:flex;gap:8px;margin-top:16px}.actions>*{flex:1}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{aspect-ratio:1;border:0;border-radius:50%;background:transparent;font-size:16px;position:relative}
.day.has{background:#eaf1ff;color:#1856c9;font-weight:800}.day.sel{background:#087cff;color:#fff;font-weight:800}
.day .dot{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--a);bottom:5px;left:50%;transform:translateX(-50%)}
.empty{text-align:center;padding:35px;color:var(--muted)}
.offline{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#fff;color:var(--a);padding:7px 12px;border-radius:20px;z-index:100;font-size:12px;font-weight:800;box-shadow:0 3px 12px #0002}
.hide{display:none}
.syncbtn{width:100%;margin:0 0 14px;font-size:17px}
</style>
</head>
<body>
<div id="net" class="offline hide">Офлайн · данные на телефоне</div>

<div class="app">
<header>
<h1>Мои консультации</h1>
<div class="sub" id="status">Онлайн</div>
</header>

<section id="today" class="page active">
<div class="row">
<button class="btn secondary" type="button" onclick="shift(-1)">‹</button>
<button class="btn secondary" type="button" onclick="openCal()" id="dateTitle"></button>
<button class="btn secondary" type="button" onclick="shift(1)">›</button>
</div>

<div class="card" style="margin-top:12px">
<span class="muted">Записей</span>
<h2 id="count">0</h2>
<button class="btn syncbtn" type="button" onclick="manualSync()">↻ Синхронизировать</button>
</div>

<h2>Расписание</h2>
<div id="list"></div>
</section>

<section id="records" class="page">
<h2>Все записи</h2><div id="all"></div>
</section>

<section id="clients" class="page">
<div class="row"><h2>Клиенты</h2><button class="btn" type="button" onclick="newClient()">+ Клиент</button></div>
<div id="clist"></div>
</section>

<button class="btn fab" type="button" onclick="newAppt()">+</button>

<nav>
<button class="active" type="button" onclick="page('today',this)"><span class="ico">☀️</span>Сегодня</button>
<button type="button" onclick="page('records',this)"><span class="ico">🗂️</span>Записи</button>
<button type="button" onclick="page('clients',this)"><span class="ico">👥</span>Клиенты</button>
</nav>
</div>

<div id="modal" class="modal">
<div class="box">
<h2 id="mtitle">Новая консультация</h2>
<label>Клиент</label>
<div style="position:relative">
<input id="mclient" autocomplete="off">
<div id="clientSuggestions" style="display:none;position:absolute;left:0;right:0;top:100%;z-index:60;background:#fff;border:1px solid #e1e5ec;border-radius:12px;box-shadow:0 8px 24px #0002;max-height:220px;overflow:auto"></div>
</div>

<label>Дата</label><input type="date" id="mdate">
<label>Начало</label><input type="time" id="mtime">
<label>До</label><input type="time" id="mend">

<label>Тип</label>
<div class="choices">
<button class="choice on" id="face" type="button" onclick="setType('Очная консультация')">Очная консультация</button>
<button class="choice" id="phone" type="button" onclick="setType('Телефонная консультация')">Телефонная консультация</button>
</div>

<label>Заметка</label><textarea id="mnote" rows="3"></textarea>
<div class="actions">
<button class="btn secondary" type="button" onclick="closeM()">Отмена</button>
<button class="btn" type="button" onclick="saveAppt()">Сохранить</button>
</div>
<button id="del" class="btn danger" type="button" style="width:100%;margin-top:8px" onclick="delAppt()">Удалить запись</button>
</div>
</div>

<div id="cal" class="modal">
<div class="box">
<div class="row">
<button class="btn secondary" type="button" onclick="cm(-1)">‹</button>
<h2 id="mlabel"></h2>
<button class="btn secondary" type="button" onclick="cm(1)">›</button>
</div>
<div style="display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:#9aa0aa;font-weight:700;font-size:12px">
<span>ПН</span><span>ВТ</span><span>СР</span><span>ЧТ</span><span>ПТ</span><span>СБ</span><span>ВС</span>
</div>
<div id="calgrid" class="calendar"></div>
<button class="btn secondary" style="width:100%;margin-top:12px" type="button" onclick="closeCal()">Готово</button>
</div>
</div>

<div id="clientModal" class="modal">
<div class="box">
<h2 id="ctitle">Новый клиент</h2>
<label>Имя</label><input id="cname">
<label>Телефон</label><input id="cphone">
<label>Заметка</label><textarea id="cnote" rows="3"></textarea>
<h3 style="margin:18px 0 8px">История консультаций</h3>
<div id="chistory"></div>
<div class="actions">
<button class="btn secondary" type="button" onclick="closeClient()">Отмена</button>
<button class="btn" type="button" onclick="saveClient()">Сохранить</button>
</div>
<button id="cdel" class="btn danger" type="button" style="width:100%;margin-top:8px" onclick="delClient()">Удалить клиента</button>
</div>
</div>

<script>
const KEY='moi_offline_v2';
const API='https://moifinal.vercel.app/api';

let db={appointments:[],clients:[],queue:[],tmp:-1};
let date=new Date();
let selected=key(date);
let editId=null;
let type='Очная консультация';
let month=selected.slice(0,7);
let editClientName=null;

try{db=JSON.parse(localStorage.getItem(KEY))||db}catch(e){}

function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(k){
 let [y,m,d]=k.split('-'),dt=new Date(+y,+m-1,+d);
 let mn=new Intl.DateTimeFormat('ru-RU',{month:'long'}).format(dt);
 let wd=new Intl.DateTimeFormat('ru-RU',{weekday:'long'}).format(dt);
 wd=wd.charAt(0).toUpperCase()+wd.slice(1);
 return (+d)+' '+mn+' '+y+' года, '+wd;
}
function end(a){
 if(a.end_time)return a.end_time;
 let [h,m]=a.time.split(':').map(Number),n=(h*60+m+(+a.duration||60))%1440;
 return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
}
function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}

function page(id,b){
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
 b.classList.add('active');
 render();
}

function render(){
 document.getElementById('dateTitle').textContent=fmt(selected);
 let a=db.appointments.filter(x=>x.date===selected).sort((a,b)=>a.time.localeCompare(b.time));
 document.getElementById('count').textContent=a.length;
 document.getElementById('list').innerHTML=a.length?a.map(card).join(''):'<div class="empty">Записей нет</div>';

 let todayKey=key(new Date());
 let upcoming=db.appointments.filter(a=>a.date>=todayKey).slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 document.getElementById('all').innerHTML=upcoming.map(a=>card(a,true)).join('')||'<div class="empty">Записей нет</div>';

 document.getElementById('clist').innerHTML=db.clients.slice().sort((a,b)=>a.name.localeCompare(b.name,'ru'))
 .map(c=>`<div class="card" onclick="editClient('${esc(c.name)}')"><b>${esc(c.name)}</b><div class="muted">${esc(c.phone||'Телефон не указан')}</div></div>`).join('')
 ||'<div class="empty">Клиентов пока нет</div>';

 document.getElementById('status').textContent=navigator.onLine
 ?(db.queue.length?'Онлайн · есть изменения для синхронизации':'Онлайн')
 :'Офлайн · данные на телефоне';
 document.getElementById('net').classList.toggle('hide',navigator.onLine);
}

function card(a,d){
 return `<div class="card appointment" onclick="editAppt(${a.id})">
 ${d?`<div class="muted">${esc(fmt(a.date))}</div>`:''}
 <div class="time">${esc(a.time)}–${esc(end(a))}</div>
 <div class="name">${esc(a.client_name)}</div>
 <div class="muted">${esc(a.type||'Консультация')}</div>
 </div>`;
}

function shift(n){
 let d=new Date(selected+'T12:00');
 d.setDate(d.getDate()+n);
 selected=key(d);
 month=selected.slice(0,7);
 render();
}

function openCal(){
 month=selected.slice(0,7);
 renderCal();
 document.getElementById('cal').classList.add('open');
}

function closeCal(){document.getElementById('cal').classList.remove('open')}

function cm(n){
 let [y,m]=month.split('-').map(Number);
 let d=new Date(y,m-1+n,1);
 month=key(d).slice(0,7);
 renderCal();
}

function renderCal(){
 let [y,m]=month.split('-').map(Number);
 let f=new Date(y,m-1,1);
 let days=new Date(y,m,0).getDate();
 let off=(f.getDay()+6)%7,has={};
 db.appointments.forEach(a=>has[a.date]=(has[a.date]||0)+1);
 document.getElementById('mlabel').textContent=new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(f);
 let s='';
 for(let i=0;i<off;i++)s+='<span></span>';
 for(let d=1;d<=days;d++){
   let k=key(new Date(y,m-1,d));
   s+=`<button class="day ${has[k]?'has':''} ${k===selected?'sel':''}" type="button" onclick="pickDay('${k}')">${d}${has[k]?'<i class="dot"></i>':''}</button>`;
 }
 document.getElementById('calgrid').innerHTML=s;
}

function pickDay(k){
 selected=k;
 month=k.slice(0,7);
 closeCal();
 render();
}

function setType(value){
 type=value;
 document.getElementById('face').classList.toggle('on',type==='Очная консультация');
 document.getElementById('phone').classList.toggle('on',type==='Телефонная консультация');
}

function addHour(t){
 if(!/^\\d{2}:\\d{2}$/.test(t))return '';
 let [h,m]=t.split(':').map(Number),n=(h*60+m+60)%1440;
 return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
}
function syncEndFromStart(){
 let start=document.getElementById('mtime'),finish=document.getElementById('mend');
 if(start&&finish&&start.value)finish.value=addHour(start.value);
}

function newAppt(){
 editId=null;
 document.getElementById('mtitle').textContent='Новая консультация';
 document.getElementById('mclient').value='';
 document.getElementById('mdate').value=selected;
 document.getElementById('mtime').value='12:00';
 syncEndFromStart();
 document.getElementById('mnote').value='';
 setType('Очная консультация');
 document.getElementById('del').style.display='none';
 document.getElementById('modal').classList.add('open');
}

function editAppt(id){
 let a=db.appointments.find(x=>+x.id===+id);
 if(!a)return;
 editId=id;
 document.getElementById('mtitle').textContent='Редактировать запись';
 document.getElementById('mclient').value=a.client_name;
 document.getElementById('mdate').value=a.date;
 document.getElementById('mtime').value=a.time;
 document.getElementById('mend').value=end(a);
 document.getElementById('mnote').value=a.note||'';
 setType(a.type||'Очная консультация');
 document.getElementById('del').style.display='block';
 document.getElementById('modal').classList.add('open');
}

function closeM(){document.getElementById('modal').classList.remove('open')}

async function saveAppt(){
 let client=document.getElementById('mclient').value.trim();
 let match=db.clients.find(c=>c.name.toLocaleLowerCase('ru-RU')===client.toLocaleLowerCase('ru-RU'));
 if(match)client=match.name;

 let start=document.getElementById('mtime').value;
 let finish=document.getElementById('mend').value;
 let sh=+start.split(':')[0],sm=+start.split(':')[1],eh=+finish.split(':')[0],em=+finish.split(':')[1];
 let duration=eh*60+em-(sh*60+sm);

 let d={
  client_name:client,
  client_id:match?match.id:null,
  date:document.getElementById('mdate').value,
  time:start,
  end_time:finish,
  type:type,
  note:document.getElementById('mnote').value.trim(),
  duration:duration,
  price:0
 };

 if(!d.client_name)return alert('Укажите клиента');
 if(!d.date||!d.time||!d.end_time)return alert('Укажите дату и время');
 if(d.duration<=0)return alert('Время окончания должно быть позже начала');

 if(editId==null){
  d.id=db.tmp--;
  db.appointments.push(d);
  db.queue.push({t:'ac',d:{...d,id:undefined}});
 }else{
  let a=db.appointments.find(x=>+x.id===+editId);
  if(a)Object.assign(a,d,{id:editId});
  if(+editId<0){
    let q=db.queue.find(x=>x.t==='ac'&&x.d&&x.d.id===undefined);
    if(q)q.d={...d,id:undefined};
  }else{
    db.queue.push({t:'au',d:{...d,id:editId}});
  }
 }

 save();
 closeM();
 selected=d.date;
 render();
 await sync();
}

async function delAppt(){
 if(!confirm('Удалить запись?'))return;
 const id=+editId;
 if(!Number.isFinite(id))return;

 if(id>0){
  if(!navigator.onLine){alert('Нет связи с сервером. Подключитесь к интернету и повторите удаление.');return}
  try{
   const r=await fetch(API+'/appointments?id='+encodeURIComponent(id),{method:'DELETE',cache:'no-store'});
   const j=await r.json().catch(()=>({}));
   if(!r.ok){alert(j.error||'Не удалось удалить запись');return}
   db.appointments=db.appointments.filter(x=>+x.id!==id);
   save();closeM();render();await sync();
  }catch(e){alert('Не удалось удалить запись. Проверьте интернет и повторите.')}
 }else{
  db.appointments=db.appointments.filter(x=>+x.id!==id);
  db.queue=db.queue.filter(q=>!(q.t==='ac'&&q.d&&q.d.id===undefined));
  save();closeM();render();
 }
}

function newClient(){
 editClientName=null;
 document.getElementById('ctitle').textContent='Новый клиент';
 document.getElementById('cname').value='';
 document.getElementById('cphone').value='';
 document.getElementById('cnote').value='';
 document.getElementById('chistory').innerHTML='';
 document.getElementById('cdel').style.display='none';
 document.getElementById('clientModal').classList.add('open');
}

function editClient(n){
 let c=db.clients.find(x=>x.name===n);
 if(!c)return;
 editClientName=n;
 document.getElementById('ctitle').textContent='Клиент';
 document.getElementById('cname').value=c.name;
 document.getElementById('cphone').value=c.phone||'';
 document.getElementById('cnote').value=c.note||'';

 let h=db.appointments.filter(a=>(c.id!=null&&a.client_id!=null&&+a.client_id===+c.id)||a.client_name===n)
 .slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));

 document.getElementById('chistory').innerHTML=h.length?h.map(a=>
 `<div class="card" style="margin:6px 0;padding:12px">
 <div class="muted">${esc(fmt(a.date))}</div><b>${esc(a.time)}–${esc(end(a))}</b>
 <div>${esc(a.type||'Консультация')}</div>${a.note?`<div class="muted" style="margin-top:4px">${esc(a.note)}</div>`:''}
 </div>`).join(''):'<div class="empty" style="padding:15px">Консультаций нет</div>';

 document.getElementById('cdel').style.display='block';
 document.getElementById('clientModal').classList.add('open');
}

function closeClient(){document.getElementById('clientModal').classList.remove('open')}

function saveClient(){
 let d={
  old_name:editClientName||'',
  name:document.getElementById('cname').value.trim(),
  phone:document.getElementById('cphone').value.trim(),
  note:document.getElementById('cnote').value.trim()
 };
 if(!d.name)return alert('Укажите имя');

 if(editClientName){
  let c=db.clients.find(x=>x.name===editClientName);
  if(c)Object.assign(c,{name:d.name,phone:d.phone,note:d.note});
  db.appointments.forEach(a=>{if(a.client_name===editClientName)a.client_name=d.name});
  db.queue.push({t:'cu',d});
 }else{
  db.clients.push({id:db.tmp--,name:d.name,phone:d.phone,note:d.note});
  db.queue.push({t:'cc',d});
 }

 save();closeClient();render();sync();
}

function delClient(){
 if(!confirm('Удалить клиента?'))return;
 db.clients=db.clients.filter(x=>x.name!==editClientName);
 db.queue.push({t:'cd',name:editClientName});
 save();closeClient();render();sync();
}

async function sync(){
 if(!navigator.onLine)return;

 try{
  for(const q of [...db.queue]){
   let u=q.t[1]==='a'?API+'/appointments':API+'/clients';
   let method=q.t[1]==='d'?'DELETE':q.t[1]==='c'?'POST':'PUT';
   let body=q.t==='cd'?{name:q.name}:q.d;

   let r=await fetch(u,{
    method,
    headers:{'Content-Type':'application/json'},
    cache:'no-store',
    body:method==='DELETE'?JSON.stringify(body):JSON.stringify(body)
   });

   if(!r.ok)throw new Error('HTTP '+r.status);
   db.queue.splice(db.queue.indexOf(q),1);
   save();
  }

  let [ra,rc]=await Promise.all([
   fetch(API+'/appointments',{cache:'no-store'}),
   fetch(API+'/clients',{cache:'no-store'})
  ]);

  if(!ra.ok||!rc.ok)throw new Error('Не удалось получить данные сервера');

  let a=await ra.json(),c=await rc.json();

  db.appointments=(a.appointments||[]).map(x=>({...x,end_time:end(x)}));
  db.clients=c.clients||db.clients;
  save();
  render();
  return true;
 }catch(e){
  render();
  return false;
}

async function manualSync(){
 if(!navigator.onLine){alert('Нет интернета. Записи на телефоне сохранены.');return}
 document.getElementById('status').textContent='Синхронизация...';
 let ok=await sync();
 if(!ok)alert('Синхронизация не завершена. Записи на телефоне сохранены.');
 else alert('Синхронизация завершена.');
 render();
}

document.getElementById('mtime').addEventListener('input',syncEndFromStart);
document.getElementById('mtime').addEventListener('change',syncEndFromStart);

addEventListener('online',()=>sync());
addEventListener('offline',render);

if('serviceWorker' in navigator){
 navigator.serviceWorker.register('/sw.js?v=20260929-3',{updateViaCache:'none'})
 .then(r=>r.update()).catch(()=>{});
}

if(navigator.onLine)sync();
render();
</script>
</body>
</html>
